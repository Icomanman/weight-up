<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">FatSecret bounded monthly backfill sequence</title>
  <desc id="desc">A runner creates one OAuth session, requests monthly summaries through get_by_month, filters dates, writes JSONL records and advances a checkpoint.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      .heading{font:700 18px system-ui,sans-serif;fill:#172033}
      .label{font:14px system-ui,sans-serif;fill:#172033}
      .small{font:12px system-ui,sans-serif;fill:#475569}
      .actor{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .service{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
      .store{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}
      .line{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .reply{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
      .lifeline{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:4 6}
      .frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
      .frametab{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1120" height="800" fill="#fff"/>

  <rect class="actor" x="35" y="28" width="220" height="54" rx="8"/>
  <text class="heading" x="145" y="61" text-anchor="middle">Backfill runner</text>
  <rect class="service" x="340" y="28" width="220" height="54" rx="8"/>
  <text class="heading" x="450" y="61" text-anchor="middle">OAuth session</text>
  <rect class="service" x="645" y="28" width="220" height="54" rx="8"/>
  <text class="heading" x="755" y="61" text-anchor="middle">FatSecret API</text>
  <rect class="store" x="905" y="28" width="180" height="54" rx="8"/>
  <text class="heading" x="995" y="61" text-anchor="middle">JSONL + cursor</text>

  <line class="lifeline" x1="145" y1="82" x2="145" y2="770"/>
  <line class="lifeline" x1="450" y1="82" x2="450" y2="770"/>
  <line class="lifeline" x1="755" y1="82" x2="755" y2="770"/>
  <line class="lifeline" x1="995" y1="82" x2="995" y2="770"/>

  <text class="label" x="145" y="119" text-anchor="middle">Create output writer</text>
  <line class="line" x1="145" y1="132" x2="995" y2="132"/>
  <text class="small" x="570" y="124" text-anchor="middle">Read next_month or initialise it to today</text>

  <line class="line" x1="145" y1="178" x2="450" y2="178"/>
  <text class="small" x="297" y="169" text-anchor="middle">create_authenticated_session()</text>

  <rect class="frame" x="64" y="210" width="1016" height="432" rx="8"/>
  <path class="frametab" d="M64 210h66v28H64z"/>
  <text class="label" x="97" y="229" text-anchor="middle">loop</text>
  <text class="small" x="155" y="229">one request per month, latest month first</text>

  <line class="line" x1="145" y1="280" x2="450" y2="280"/>
  <text class="small" x="297" y="270" text-anchor="middle">get_by_month(format, FatDate(cursor), session)</text>

  <line class="line" x1="450" y1="323" x2="755" y2="323"/>
  <text class="small" x="602" y="313" text-anchor="middle">Signed GET: date + format=json</text>
  <line class="reply" x1="755" y1="364" x2="450" y2="364"/>
  <text class="small" x="602" y="355" text-anchor="middle">HTTP response for the complete month</text>

  <rect x="402" y="388" width="96" height="46" rx="5" fill="#fff7ed" stroke="#f97316"/>
  <text class="small" x="450" y="407" text-anchor="middle">check status</text>
  <text class="small" x="450" y="423" text-anchor="middle">parse day list</text>
  <text class="small" x="145" y="460" text-anchor="middle">Filter records:</text>
  <text class="small" x="145" y="478" text-anchor="middle">start ≤ day ≤ end</text>

  <line class="line" x1="145" y1="508" x2="995" y2="508"/>
  <text class="small" x="570" y="499" text-anchor="middle">write_records(): append selected days; skip dates already saved</text>

  <line class="line" x1="145" y1="554" x2="995" y2="554"/>
  <text class="small" x="570" y="545" text-anchor="middle">set_next_month(): persist previous month after append</text>
  <line class="line" x1="145" y1="600" x2="145" y2="616"/>
  <text class="small" x="185" y="612">Continue until next month precedes the start-bound month</text>

  <line class="line" x1="145" y1="687" x2="995" y2="687"/>
  <text class="small" x="570" y="678" text-anchor="middle">Write null cursor after final month; close the authenticated session</text>
  <text class="small" x="560" y="746" text-anchor="middle">A retry may fetch the last month again; date de-duplication keeps JSONL rows unique.</text>
</svg>
