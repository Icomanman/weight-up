<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 1236" width="1224" height="1236" role="img" aria-labelledby="t d">
<title id="t">Xiaomi login sequence</title>
<desc id="d">Caller logs in to account.xiaomi.com: serviceLogin returns a _sign, serviceLoginAuth2 takes the hashed password, an optional captcha is solved in the same session, then either the email 2FA flow or a direct location URL leads to sts.api.io.mi.com, which sets the serviceToken cookie.</desc>
<rect width="1224" height="1236" fill="#ffffff"/>

<defs>
<marker id="a-i" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
</defs>

<style>.lbl{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:13px;fill:#1e293b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.num{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:11px;font-weight:700;fill:#fff}.pn{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:13px;font-weight:700}.fk{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:700;fill:#1e293b}.fl{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:12.5px;fill:#1e293b}</style>
<rect x="24" y="324" width="1176" height="216" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M24 324 h46 v18 l-8 8 h-38 z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
<text class="fk" x="34" y="342">alt</text>
<text class="fl" x="82" y="343">[captcha required]</text>
<rect x="24" y="572" width="1176" height="576" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M24 572 h46 v18 l-8 8 h-38 z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
<text class="fk" x="34" y="590">alt</text>
<text class="fl" x="82" y="591">[2FA required]</text>
<line x1="24" y1="968" x2="1200" y2="968" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="7 5"/>
<text class="fl" x="34" y="987">[no challenge]</text>
<line x1="130" y1="64" x2="130" y2="1170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 5"/>
<line x1="480" y1="64" x2="480" y2="1170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 5"/>
<line x1="830" y1="64" x2="830" y2="1170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 5"/>
<line x1="1110" y1="64" x2="1110" y2="1170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 5"/>
<rect x="48" y="20" width="164" height="44" rx="7" fill="#f4f0fb" stroke="#6d4fb3" stroke-width="1.6"/>
<text class="pn" x="130" y="47" text-anchor="middle" fill="#6d4fb3">Caller</text>
<rect x="48" y="1172" width="164" height="44" rx="7" fill="#f4f0fb" stroke="#6d4fb3" stroke-width="1.6"/>
<text class="pn" x="130" y="1199" text-anchor="middle" fill="#6d4fb3">Caller</text>
<rect x="398" y="20" width="164" height="44" rx="7" fill="#eaf3fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text class="pn" x="480" y="47" text-anchor="middle" fill="#2f6fb0">account.xiaomi.com</text>
<rect x="398" y="1172" width="164" height="44" rx="7" fill="#eaf3fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text class="pn" x="480" y="1199" text-anchor="middle" fill="#2f6fb0">account.xiaomi.com</text>
<rect x="748" y="20" width="164" height="44" rx="7" fill="#eaf3fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text class="pn" x="830" y="47" text-anchor="middle" fill="#2f6fb0">sts.api.io.mi.com</text>
<rect x="748" y="1172" width="164" height="44" rx="7" fill="#eaf3fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text class="pn" x="830" y="1199" text-anchor="middle" fill="#2f6fb0">sts.api.io.mi.com</text>
<rect x="1028" y="20" width="164" height="44" rx="7" fill="#fdf5e6" stroke="#b7791f" stroke-width="1.6"/>
<text class="pn" x="1110" y="47" text-anchor="middle" fill="#b7791f">User (email)</text>
<rect x="1028" y="1172" width="164" height="44" rx="7" fill="#fdf5e6" stroke="#b7791f" stroke-width="1.6"/>
<text class="pn" x="1110" y="1199" text-anchor="middle" fill="#b7791f">User (email)</text>
<text class="lbl" x="305.0" y="128" text-anchor="middle">GET /pass/serviceLogin?sid=xiaomiio&amp;_json=true</text>
<text class="lbl" x="305.0" y="146" text-anchor="middle">(cookie userId=email)</text>
<line x1="130" y1="162" x2="479" y2="162" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="162" r="9.5" fill="#1e293b"/><text class="num" x="145" y="166" text-anchor="middle">1</text>
<text class="lbl" x="305.0" y="200" text-anchor="middle">{_sign}</text>
<line x1="480" y1="216" x2="131" y2="216" stroke="#1e293b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#a-i)"/>
<circle cx="465" cy="216" r="9.5" fill="#1e293b"/><text class="num" x="465" y="220" text-anchor="middle">2</text>
<text class="lbl" x="305.0" y="254" text-anchor="middle">POST /pass/serviceLoginAuth2</text>
<text class="lbl" x="305.0" y="272" text-anchor="middle">(md5(password), _sign, …)</text>
<line x1="130" y1="288" x2="479" y2="288" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="288" r="9.5" fill="#1e293b"/><text class="num" x="145" y="292" text-anchor="middle">3</text>
<text class="lbl" x="305.0" y="370" text-anchor="middle">{captchaUrl}</text>
<line x1="480" y1="386" x2="131" y2="386" stroke="#1e293b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#a-i)"/>
<circle cx="465" cy="386" r="9.5" fill="#1e293b"/><text class="num" x="465" y="390" text-anchor="middle">4</text>
<text class="lbl" x="305.0" y="424" text-anchor="middle">GET captchaUrl (same session) → image</text>
<line x1="130" y1="440" x2="479" y2="440" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="440" r="9.5" fill="#1e293b"/><text class="num" x="145" y="444" text-anchor="middle">5</text>
<text class="lbl" x="305.0" y="478" text-anchor="middle">POST /pass/serviceLoginAuth2 again</text>
<text class="lbl" x="305.0" y="496" text-anchor="middle">+ captCode</text>
<line x1="130" y1="512" x2="479" y2="512" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="512" r="9.5" fill="#1e293b"/><text class="num" x="145" y="516" text-anchor="middle">6</text>
<text class="lbl" x="305.0" y="618" text-anchor="middle">{notificationUrl}</text>
<line x1="480" y1="634" x2="131" y2="634" stroke="#1e293b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#a-i)"/>
<circle cx="465" cy="634" r="9.5" fill="#1e293b"/><text class="num" x="465" y="638" text-anchor="middle">7</text>
<text class="lbl" x="305.0" y="672" text-anchor="middle">identity flow (section 3.4)</text>
<line x1="130" y1="688" x2="479" y2="688" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="688" r="9.5" fill="#1e293b"/><text class="num" x="145" y="692" text-anchor="middle">8</text>
<text class="lbl" x="795.0" y="726" text-anchor="middle">emails a code</text>
<line x1="480" y1="742" x2="1109" y2="742" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="495" cy="742" r="9.5" fill="#1e293b"/><text class="num" x="495" y="746" text-anchor="middle">9</text>
<text class="lbl" x="620.0" y="780" text-anchor="middle">code (via code_provider)</text>
<line x1="1110" y1="796" x2="131" y2="796" stroke="#1e293b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#a-i)"/>
<circle cx="1095" cy="796" r="9.5" fill="#1e293b"/><text class="num" x="1095" y="800" text-anchor="middle">10</text>
<text class="lbl" x="305.0" y="834" text-anchor="middle">verify code → Auth2/end</text>
<text class="lbl" x="305.0" y="852" text-anchor="middle">→ ssecurity header</text>
<line x1="130" y1="868" x2="479" y2="868" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="868" r="9.5" fill="#1e293b"/><text class="num" x="145" y="872" text-anchor="middle">11</text>
<text class="lbl" x="480.0" y="906" text-anchor="middle">GET sts URL</text>
<text class="lbl" x="480.0" y="924" text-anchor="middle">→ Set-Cookie serviceToken</text>
<line x1="130" y1="940" x2="829" y2="940" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="940" r="9.5" fill="#1e293b"/><text class="num" x="145" y="944" text-anchor="middle">12</text>
<text class="lbl" x="305.0" y="1014" text-anchor="middle">{ssecurity, location, userId,</text>
<text class="lbl" x="305.0" y="1032" text-anchor="middle">cUserId, passToken}</text>
<line x1="480" y1="1048" x2="131" y2="1048" stroke="#1e293b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#a-i)"/>
<circle cx="465" cy="1048" r="9.5" fill="#1e293b"/><text class="num" x="465" y="1052" text-anchor="middle">13</text>
<text class="lbl" x="480.0" y="1086" text-anchor="middle">GET location</text>
<text class="lbl" x="480.0" y="1104" text-anchor="middle">→ Set-Cookie serviceToken</text>
<line x1="130" y1="1120" x2="829" y2="1120" stroke="#1e293b" stroke-width="1.7" marker-end="url(#a-i)"/>
<circle cx="145" cy="1120" r="9.5" fill="#1e293b"/><text class="num" x="145" y="1124" text-anchor="middle">14</text>
</svg>
