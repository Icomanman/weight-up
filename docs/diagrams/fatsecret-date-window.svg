<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">FatSecret monthly requests clipped to an inclusive date window</title>
  <desc id="desc">Thirteen complete monthly summaries are queried from October 2025 through October 2026. The first response is filtered from October 16 and the last through October 17.</desc>
  <defs>
    <style>
      .title{font:700 20px system-ui,sans-serif;fill:#172033}
      .label{font:14px system-ui,sans-serif;fill:#172033}
      .small{font:12px system-ui,sans-serif;fill:#475569}
      .month{fill:#e0e7ff;stroke:#6366f1;stroke-width:1.3}
      .edge{fill:#ffedd5;stroke:#f97316;stroke-width:1.5}
      .bound{stroke:#dc2626;stroke-width:2;stroke-dasharray:6 4}
      .axis{stroke:#64748b;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1120" height="420" fill="#fff"/>
  <text class="title" x="560" y="42" text-anchor="middle">Monthly API responses, exact local output window</text>
  <text class="label" x="560" y="82" text-anchor="middle">Each API request returns its entire month; only the orange-edge months need boundary filtering.</text>

  <line class="axis" x1="72" y1="210" x2="1048" y2="210"/>
  <rect class="edge" x="72" y="150" width="74" height="82" rx="5"/>
  <text class="label" x="109" y="185" text-anchor="middle">Oct</text>
  <text class="small" x="109" y="204" text-anchor="middle">2025</text>
  <text class="small" x="109" y="250" text-anchor="middle">partial</text>
  <rect class="month" x="151" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="184" y="197" text-anchor="middle">Nov</text>
  <rect class="month" x="223" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="256" y="197" text-anchor="middle">Dec</text>
  <rect class="month" x="295" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="328" y="197" text-anchor="middle">Jan</text>
  <rect class="month" x="367" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="400" y="197" text-anchor="middle">Feb</text>
  <rect class="month" x="439" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="472" y="197" text-anchor="middle">Mar</text>
  <rect class="month" x="511" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="544" y="197" text-anchor="middle">Apr</text>
  <rect class="month" x="583" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="616" y="197" text-anchor="middle">May</text>
  <rect class="month" x="655" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="688" y="197" text-anchor="middle">Jun</text>
  <rect class="month" x="727" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="760" y="197" text-anchor="middle">Jul</text>
  <rect class="month" x="799" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="832" y="197" text-anchor="middle">Aug</text>
  <rect class="month" x="871" y="150" width="67" height="82" rx="5"/>
  <text class="label" x="904" y="197" text-anchor="middle">Sep</text>
  <rect class="edge" x="943" y="150" width="74" height="82" rx="5"/>
  <text class="label" x="980" y="185" text-anchor="middle">Oct</text>
  <text class="small" x="980" y="204" text-anchor="middle">2026</text>
  <text class="small" x="980" y="250" text-anchor="middle">partial</text>

  <line class="bound" x1="109" y1="127" x2="109" y2="278"/>
  <line class="bound" x1="980" y1="127" x2="980" y2="278"/>
  <text class="label" x="109" y="112" text-anchor="middle">16 Oct 2025</text>
  <text class="label" x="980" y="112" text-anchor="middle">17 Oct 2026</text>

  <path d="M109 295v18h871v-18" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text class="label" x="545" y="343" text-anchor="middle">13 monthly requests · inclusive bounds · 355 daily summaries returned</text>
  <text class="small" x="545" y="374" text-anchor="middle">Only records whose FatDate falls inside the red boundary lines are written.</text>
</svg>
