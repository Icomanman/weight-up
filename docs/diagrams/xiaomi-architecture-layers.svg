<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" role="img" aria-labelledby="t d">
<title id="t">Xiaomi package layers and dependency rule</title>
<desc id="d">Three layers. The application layer (cli and the pull script) depends on the adapter layer (auth, two_factor, session, api) and on weights in the pure domain layer. Adapters depend on the domain (models, signing, weights). No arrow points up a layer.</desc>
<rect width="1100" height="690" fill="#ffffff"/>
<defs>
<marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d4fb3"/></marker>
<marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/></marker>
<marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b5a"/></marker>
<marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<style>.mono{font-family:'DejaVu Sans Mono', Consolas, 'Courier New', monospace;font-size:12.5px;fill:#1e293b}.sub{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:11px;fill:#64748b}.band{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.4px}.bsub{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:11px;fill:#64748b}.note{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-size:12px;fill:#1e293b}</style>
<rect x="64" y="70" width="1020" height="130" rx="12" fill="#f4f0fb" stroke="#6d4fb3" stroke-width="1.5"/>
<text class="band" fill="#6d4fb3" text-anchor="middle" transform="translate(30 135.0) rotate(-90)">APPLICATION</text>
<text class="bsub" text-anchor="middle" transform="translate(46 135.0) rotate(-90)">prompts · printing</text>
<rect x="64" y="262" width="1020" height="142" rx="12" fill="#eaf3fb" stroke="#2f6fb0" stroke-width="1.5"/>
<text class="band" fill="#2f6fb0" text-anchor="middle" transform="translate(30 333.0) rotate(-90)">ADAPTERS</text>
<text class="bsub" text-anchor="middle" transform="translate(46 333.0) rotate(-90)">Xiaomi HTTP</text>
<rect x="64" y="466" width="1020" height="140" rx="12" fill="#eaf6ee" stroke="#2e8b5a" stroke-width="1.5"/>
<text class="band" fill="#2e8b5a" text-anchor="middle" transform="translate(30 536.0) rotate(-90)">DOMAIN</text>
<text class="bsub" text-anchor="middle" transform="translate(46 536.0) rotate(-90)">pure · no network</text>
<rect x="95" y="302" width="160" height="60" rx="8" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/><text class="mono" x="175.0" y="328" text-anchor="middle">auth.py</text><text class="sub" x="175.0" y="346" text-anchor="middle">login, login_with_token</text>
<rect x="305" y="302" width="160" height="60" rx="8" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/><text class="mono" x="385.0" y="328" text-anchor="middle">two_factor.py</text><text class="sub" x="385.0" y="346" text-anchor="middle">email-code challenge</text>
