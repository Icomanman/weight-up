<rect x="480" y="112" width="300" height="60" rx="8" fill="#ffffff" stroke="#6d4fb3" stroke-width="1.5"/><text class="mono" x="630.0" y="138" text-anchor="middle">cli.py  ·  __main__.py</text><text class="sub" x="630.0" y="156" text-anchor="middle">prompts, printing, captcha file</text>
