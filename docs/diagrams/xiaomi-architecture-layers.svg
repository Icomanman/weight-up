<path d="M850 362 V436 H600 V504" fill="none" stroke="#ffffff" stroke-width="6.3" stroke-linejoin="round"/><path d="M850 362 V436 H600 V504" fill="none" stroke="#2f6fb0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-b)"/>
