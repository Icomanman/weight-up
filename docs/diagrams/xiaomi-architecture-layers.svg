<rect x="95" y="506" width="160" height="60" rx="8" fill="#ffffff" stroke="#2e8b5a" stroke-width="1.5"/><text class="mono" x="175.0" y="532" text-anchor="middle">models.py</text><text class="sub" x="175.0" y="550" text-anchor="middle">data + exceptions</text>
<rect x="470" y="506" width="200" height="60" rx="8" fill="#ffffff" stroke="#2e8b5a" stroke-width="1.5"/><text class="mono" x="570.0" y="532" text-anchor="middle">weights.py</text><text class="sub" x="570.0" y="550" text-anchor="middle">raw records → XiaomiWeight</text>
