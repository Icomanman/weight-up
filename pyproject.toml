[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-up"
version = "0.1.0"
description = "A personal health analytics platform and data engineering learning project."
authors = [
  { name = "Icomanman", email = "fred_barabs@yahoo.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pycryptodome>=3.20.0",
  "python-dotenv>=1.2.4",
  "requests>=2.31.0",
  "requests-oauthlib>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]